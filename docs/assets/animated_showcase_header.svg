<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 80" width="900" height="80">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#16213e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a2e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00B4D8">
        <animate attributeName="stop-color" values="#00B4D8;#48CAE4;#90E0EF;#48CAE4;#00B4D8" dur="3s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" style="stop-color:#48CAE4">
        <animate attributeName="stop-color" values="#48CAE4;#90E0EF;#00B4D8;#90E0EF;#48CAE4" dur="3s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#90E0EF">
        <animate attributeName="stop-color" values="#90E0EF;#00B4D8;#48CAE4;#00B4D8;#90E0EF" dur="3s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="900" height="80" rx="12" fill="url(#bgGrad)"/>
  
  <!-- Border glow -->
  <rect width="898" height="78" x="1" y="1" rx="11" fill="none" stroke="#00B4D8" stroke-width="1" opacity="0.5">
    <animate attributeName="opacity" values="0.3;0.7;0.3" dur="2s" repeatCount="indefinite"/>
  </rect>
  
  <!-- Rocket icon -->
  <text x="80" y="48" font-size="28" text-anchor="middle">
    🚀
    <animate attributeName="opacity" values="1;0.6;1" dur="1.5s" repeatCount="indefinite"/>
  </text>
  
  <!-- Main text -->
  <text x="450" y="35" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-weight="700" font-size="20" fill="url(#textGrad)">
    ENTERPRISE DOCUMENTATION SHOWCASE
    <animate attributeName="opacity" values="1;0.7;1" dur="2s" repeatCount="indefinite"/>
  </text>
  
  <!-- Subtitle -->
  <text x="450" y="58" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-weight="600" font-size="14" fill="#DC143C">
    SOURCE CODE PRIVATE &amp; PROPRIETARY
    <animate attributeName="opacity" values="0.8;1;0.8" dur="1.8s" repeatCount="indefinite"/>
  </text>
  
  <!-- Lock icon -->
  <text x="820" y="48" font-size="28" text-anchor="middle">
    🔒
    <animate attributeName="opacity" values="1;0.6;1" dur="1.5s" repeatCount="indefinite"/>
  </text>
  
  <!-- Decorative dots -->
  <circle cx="150" cy="40" r="3" fill="#00B4D8">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="170" cy="40" r="3" fill="#48CAE4">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" begin="0.3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="190" cy="40" r="3" fill="#90E0EF">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" begin="0.6s" repeatCount="indefinite"/>
  </circle>
  
  <circle cx="710" cy="40" r="3" fill="#90E0EF">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="730" cy="40" r="3" fill="#48CAE4">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" begin="0.3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="750" cy="40" r="3" fill="#00B4D8">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" begin="0.6s" repeatCount="indefinite"/>
  </circle>
</svg>
