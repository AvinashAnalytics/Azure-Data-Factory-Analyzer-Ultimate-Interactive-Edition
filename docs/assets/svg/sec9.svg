<!-- SECTION 9: INSTALLATION AND SETUP -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 550" width="100%">
  <defs>
    <linearGradient id="installBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
  </defs>
  
  <rect width="1200" height="550" fill="url(#installBg)"/>
  
  <!-- Section Header -->
  <g transform="translate(600, 50)">
    <text x="0" y="0" text-anchor="middle" fill="#3fb950" font-family="system-ui, sans-serif" font-size="32" font-weight="700">
      Installation and Setup
    </text>
    <rect x="-100" y="15" width="200" height="3" rx="1.5" fill="#3fb950" opacity="0.6"/>
  </g>
  
  <!-- Prerequisites -->
  <g transform="translate(50, 100)">
    <text x="0" y="0" fill="#58a6ff" font-family="system-ui, sans-serif" font-size="18" font-weight="600">Prerequisites</text>
    
    <g transform="translate(0, 25)">
      <rect x="0" y="0" width="340" height="60" rx="8" fill="#21262d" stroke="#30363d" stroke-width="1"/>
      <circle cx="30" cy="30" r="16" fill="#3fb950" opacity="0.2"/>
      <text x="30" y="35" text-anchor="middle" fill="#3fb950" font-family="system-ui, sans-serif" font-size="16" font-weight="600">Py</text>
      <text x="60" y="27" fill="#c9d1d9" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Python 3.8+</text>
      <text x="60" y="45" fill="#8b949e" font-family="system-ui, sans-serif" font-size="11">Recommended: 3.9 or 3.10</text>
      
      <rect x="360" y="0" width="340" height="60" rx="8" fill="#21262d" stroke="#30363d" stroke-width="1"/>
      <circle cx="390" cy="30" r="16" fill="#58a6ff" opacity="0.2"/>
      <text x="390" y="35" text-anchor="middle" fill="#58a6ff" font-family="system-ui, sans-serif" font-size="14" font-weight="600">OS</text>
      <text x="420" y="27" fill="#c9d1d9" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Cross-platform</text>
      <text x="420" y="45" fill="#8b949e" font-family="system-ui, sans-serif" font-size="11">Windows / Linux / macOS</text>
      
      <rect x="720" y="0" width="340" height="60" rx="8" fill="#21262d" stroke="#30363d" stroke-width="1"/>
      <circle cx="750" cy="30" r="16" fill="#a371f7" opacity="0.2"/>
      <text x="750" y="35" text-anchor="middle" fill="#a371f7" font-family="system-ui, sans-serif" font-size="12" font-weight="600">RAM</text>
      <text x="780" y="27" fill="#c9d1d9" font-family="system-ui, sans-serif" font-size="14" font-weight="600">4GB Minimum</text>
      <text x="780" y="45" fill="#8b949e" font-family="system-ui, sans-serif" font-size="11">8GB recommended for large templates</text>
    </g>
  </g>
  
  <!-- Installation Methods -->
  <g transform="translate(50, 210)">
    <text x="0" y="0" fill="#f0883e" font-family="system-ui, sans-serif" font-size="18" font-weight="600">Installation Methods</text>
    
    <!-- Method 1: Direct Installation -->
    <g transform="translate(0, 30)">
      <rect x="0" y="0" width="350" height="200" rx="10" fill="#21262d" stroke="#3fb950" stroke-width="2"/>
      <rect x="0" y="0" width="350" height="40" rx="10" fill="#238636" opacity="0.2"/>
      <rect x="0" y="30" width="350" height="10" fill="#238636" opacity="0.2"/>
      <text x="175" y="28" text-anchor="middle" fill="#3fb950" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Method 1: Direct Installation</text>
      
      <g transform="translate(15, 55)">
        <rect x="0" y="0" width="320" height="130" rx="6" fill="#161b22"/>
        <text x="10" y="25" fill="#8b949e" font-family="monospace" font-size="11"># Install core dependencies</text>
        <text x="10" y="45" fill="#79c0ff" font-family="monospace" font-size="11">pip install streamlit pandas</text>
        <text x="10" y="60" fill="#79c0ff" font-family="monospace" font-size="11">openpyxl plotly networkx</text>
        <text x="10" y="85" fill="#8b949e" font-family="monospace" font-size="11"># Verify installation</text>
        <text x="10" y="105" fill="#79c0ff" font-family="monospace" font-size="11">python scripts/verify_installation.py</text>
      </g>
    </g>
    
    <!-- Method 2: Virtual Environment -->
    <g transform="translate(380, 30)">
      <rect x="0" y="0" width="350" height="200" rx="10" fill="#21262d" stroke="#58a6ff" stroke-width="2"/>
      <rect x="0" y="0" width="350" height="40" rx="10" fill="#1f6feb" opacity="0.2"/>
      <rect x="0" y="30" width="350" height="10" fill="#1f6feb" opacity="0.2"/>
      <text x="175" y="28" text-anchor="middle" fill="#58a6ff" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Method 2: Virtual Environment</text>
      <text x="290" y="28" fill="#f0883e" font-family="system-ui, sans-serif" font-size="10" font-weight="600">RECOMMENDED</text>
      
      <g transform="translate(15, 55)">
        <rect x="0" y="0" width="320" height="130" rx="6" fill="#161b22"/>
        <text x="10" y="25" fill="#8b949e" font-family="monospace" font-size="11"># Create virtual environment</text>
        <text x="10" y="45" fill="#79c0ff" font-family="monospace" font-size="11">python -m venv adf_analyzer_env</text>
        <text x="10" y="70" fill="#8b949e" font-family="monospace" font-size="11"># Activate and install</text>
        <text x="10" y="90" fill="#79c0ff" font-family="monospace" font-size="11">source adf_analyzer_env/bin/activate</text>
        <text x="10" y="110" fill="#79c0ff" font-family="monospace" font-size="11">pip install -r requirements.txt</text>
      </g>
    </g>
    
    <!-- Method 3: Setup Script -->
    <g transform="translate(760, 30)">
      <rect x="0" y="0" width="350" height="200" rx="10" fill="#21262d" stroke="#a371f7" stroke-width="2"/>
      <rect x="0" y="0" width="350" height="40" rx="10" fill="#8b5cf6" opacity="0.2"/>
      <rect x="0" y="30" width="350" height="10" fill="#8b5cf6" opacity="0.2"/>
      <text x="175" y="28" text-anchor="middle" fill="#a371f7" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Method 3: Setup Script</text>
      
      <g transform="translate(15, 55)">
        <rect x="0" y="0" width="320" height="130" rx="6" fill="#161b22"/>
        <text x="10" y="25" fill="#8b949e" font-family="monospace" font-size="11"># Run automated setup</text>
        <text x="10" y="45" fill="#79c0ff" font-family="monospace" font-size="11">python scripts/setup_environment.py</text>
        <text x="10" y="75" fill="#8b949e" font-family="monospace" font-size="11"># Interactive prompts for:</text>
        <text x="10" y="95" fill="#3fb950" font-family="monospace" font-size="11">- Dependency installation</text>
        <text x="10" y="110" fill="#3fb950" font-family="monospace" font-size="11">- Configuration setup</text>
        <text x="10" y="125" fill="#3fb950" font-family="monospace" font-size="11">- Environment validation</text>
      </g>
    </g>
  </g>
  
  <!-- Quick Reference -->
  <g transform="translate(50, 470)">
    <rect x="0" y="0" width="1100" height="50" rx="8" fill="#21262d" stroke="#30363d" stroke-width="1"/>
    <text x="30" y="30" fill="#8b949e" font-family="system-ui, sans-serif" font-size="14">Quick Reference:</text>
    <text x="160" y="30" fill="#79c0ff" font-family="monospace" font-size="13">pip install streamlit pandas openpyxl plotly networkx</text>
    <rect x="700" y="10" width="120" height="30" rx="4" fill="#238636"/>
    <text x="760" y="30" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Copy Command</text>
  </g>
</svg>
