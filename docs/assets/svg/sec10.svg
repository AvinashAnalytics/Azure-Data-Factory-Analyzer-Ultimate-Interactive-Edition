<!-- SECTION 10: USAGE GUIDE -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" width="100%">
  <defs>
    <linearGradient id="usageBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
  </defs>
  
  <rect width="1200" height="650" fill="url(#usageBg)"/>
  
  <!-- Section Header -->
  <g transform="translate(600, 50)">
    <text x="0" y="0" text-anchor="middle" fill="#58a6ff" font-family="system-ui, sans-serif" font-size="32" font-weight="700">
      Usage Guide
    </text>
    <rect x="-60" y="15" width="120" height="3" rx="1.5" fill="#58a6ff" opacity="0.6"/>
  </g>
  
  <!-- Command Line Usage -->
  <g transform="translate(50, 100)">
    <text x="0" y="0" fill="#3fb950" font-family="system-ui, sans-serif" font-size="20" font-weight="600">Command Line Usage</text>
    
    <!-- Terminal Window -->
    <g transform="translate(0, 30)">
      <rect x="0" y="0" width="550" height="220" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      
      <!-- Terminal Header -->
      <rect x="0" y="0" width="550" height="30" rx="8" fill="#21262d"/>
      <rect x="0" y="22" width="550" height="8" fill="#21262d"/>
      <circle cx="18" cy="15" r="5" fill="#f85149"/>
      <circle cx="36" cy="15" r="5" fill="#f0883e"/>
      <circle cx="54" cy="15" r="5" fill="#3fb950"/>
      <text x="275" y="19" text-anchor="middle" fill="#8b949e" font-family="system-ui, sans-serif" font-size="11">Terminal</text>
      
      <!-- Commands -->
      <g transform="translate(15, 45)">
        <text x="0" y="0" fill="#8b949e" font-family="monospace" font-size="12"># Production Analysis (Recommended)</text>
        <text x="0" y="22" fill="#79c0ff" font-family="monospace" font-size="12">python adf_runner_wrapper.py your_template.json</text>
        
        <text x="0" y="52" fill="#8b949e" font-family="monospace" font-size="12"># With custom output directory</text>
        <text x="0" y="74" fill="#79c0ff" font-family="monospace" font-size="12">python adf_runner_wrapper.py template.json --output ./reports</text>
        
        <text x="0" y="104" fill="#8b949e" font-family="monospace" font-size="12"># Launch interactive dashboard</text>
        <text x="0" y="126" fill="#79c0ff" font-family="monospace" font-size="12">streamlit run adf_dashboard.py</text>
        
        <text x="0" y="156" fill="#8b949e" font-family="monospace" font-size="12"># Custom port configuration</text>
        <text x="0" y="178" fill="#79c0ff" font-family="monospace" font-size="12">streamlit run adf_dashboard.py --server.port 8502</text>
      </g>
    </g>
  </g>
  
  <!-- Execution Modes -->
  <g transform="translate(630, 100)">
    <text x="0" y="0" fill="#a371f7" font-family="system-ui, sans-serif" font-size="20" font-weight="600">Execution Modes</text>
    
    <g transform="translate(0, 30)">
      <!-- Basic Mode -->
      <rect x="0" y="0" width="260" height="100" rx="8" fill="#21262d" stroke="#30363d" stroke-width="1"/>
      <rect x="0" y="0" width="260" height="8" rx="4" fill="#58a6ff"/>
      <text x="130" y="35" text-anchor="middle" fill="#58a6ff" font-family="system-ui, sans-serif" font-size="13" font-weight="600">BASIC MODE</text>
      <text x="130" y="55" text-anchor="middle" fill="#8b949e" font-family="monospace" font-size="10">--basic</text>
      <text x="15" y="75" fill="#6e7681" font-family="system-ui, sans-serif" font-size="10">Skip all patches, plain output</text>
      <text x="15" y="90" fill="#6e7681" font-family="system-ui, sans-serif" font-size="10">Base analyzer only</text>
      
      <!-- Functional Only -->
      <rect x="280" y="0" width="260" height="100" rx="8" fill="#21262d" stroke="#30363d" stroke-width="1"/>
      <rect x="280" y="0" width="260" height="8" rx="4" fill="#3fb950"/>
      <text x="410" y="35" text-anchor="middle" fill="#3fb950" font-family="system-ui, sans-serif" font-size="13" font-weight="600">FUNCTIONAL ONLY</text>
      <text x="410" y="55" text-anchor="middle" fill="#8b949e" font-family="monospace" font-size="10">--skip-excel-enhancements</text>
      <text x="295" y="75" fill="#6e7681" font-family="system-ui, sans-serif" font-size="10">Apply functional patches</text>
      <text x="295" y="90" fill="#6e7681" font-family="system-ui, sans-serif" font-size="10">Extended parsers active</text>
      
      <!-- Excel Only -->
      <rect x="0" y="115" width="260" height="100" rx="8" fill="#21262d" stroke="#30363d" stroke-width="1"/>
      <rect x="0" y="115" width="260" height="8" rx="4" fill="#f0883e"/>
      <text x="130" y="150" text-anchor="middle" fill="#f0883e" font-family="system-ui, sans-serif" font-size="13" font-weight="600">EXCEL ONLY</text>
      <text x="130" y="170" text-anchor="middle" fill="#8b949e" font-family="monospace" font-size="10">--skip-functional</text>
      <text x="15" y="190" fill="#6e7681" font-family="system-ui, sans-serif" font-size="10">Apply Excel enhancements</text>
      <text x="15" y="205" fill="#6e7681" font-family="system-ui, sans-serif" font-size="10">Styled Excel output</text>
      
      <!-- Full Production -->
      <rect x="280" y="115" width="260" height="100" rx="8" fill="#21262d" stroke="#a371f7" stroke-width="2"/>
      <rect x="280" y="115" width="260" height="8" rx="4" fill="#a371f7"/>
      <text x="410" y="150" text-anchor="middle" fill="#a371f7" font-family="system-ui, sans-serif" font-size="13" font-weight="600">FULL PRODUCTION</text>
      <text x="410" y="170" text-anchor="middle" fill="#f0883e" font-family="monospace" font-size="10">default</text>
      <text x="295" y="190" fill="#c9d1d9" font-family="system-ui, sans-serif" font-size="10">All patches + enhancements</text>
      <text x="295" y="205" fill="#c9d1d9" font-family="system-ui, sans-serif" font-size="10">Fully enhanced Excel</text>
    </g>
  </g>
  
  <!-- Dashboard Workflows -->
  <g transform="translate(50, 380)">
    <text x="0" y="0" fill="#f778ba" font-family="system-ui, sans-serif" font-size="20" font-weight="600">Dashboard Workflows</text>
    
    <g transform="translate(0, 30)">
      <!-- Workflow 1 -->
      <rect x="0" y="0" width="540" height="200" rx="10" fill="#21262d" stroke="#3fb950" stroke-width="1"/>
      <text x="270" y="30" text-anchor="middle" fill="#3fb950" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Workflow 1: Generate Excel Report</text>
      
      <g transform="translate(20, 50)">
        <rect x="0" y="0" width="115" height="55" rx="6" fill="#30363d"/>
        <text x="57" y="20" text-anchor="middle" fill="#58a6ff" font-family="system-ui, sans-serif" font-size="11" font-weight="600">1. Upload</text>
        <text x="57" y="38" text-anchor="middle" fill="#8b949e" font-family="system-ui, sans-serif" font-size="9">ARM Template</text>
        
        <path d="M125 27 L140 27" stroke="#3fb950" stroke-width="2"/>
        <polygon points="140,22 150,27 140,32" fill="#3fb950"/>
        
        <rect x="155" y="0" width="115" height="55" rx="6" fill="#30363d"/>
        <text x="212" y="20" text-anchor="middle" fill="#58a6ff" font-family="system-ui, sans-serif" font-size="11" font-weight="600">2. Configure</text>
        <text x="212" y="38" text-anchor="middle" fill="#8b949e" font-family="system-ui, sans-serif" font-size="9">Options</text>
        
        <path d="M280 27 L295 27" stroke="#3fb950" stroke-width="2"/>
        <polygon points="295,22 305,27 295,32" fill="#3fb950"/>
        
        <rect x="310" y="0" width="115" height="55" rx="6" fill="#30363d"/>
        <text x="367" y="20" text-anchor="middle" fill="#58a6ff" font-family="system-ui, sans-serif" font-size="11" font-weight="600">3. Generate</text>
        <text x="367" y="38" text-anchor="middle" fill="#8b949e" font-family="system-ui, sans-serif" font-size="9">Analysis</text>
        
        <path d="M435 27 L450 27" stroke="#3fb950" stroke-width="2"/>
        <polygon points="450,22 460,27 450,32" fill="#3fb950"/>
        
        <rect x="465" y="0" width="55" height="55" rx="6" fill="#238636"/>
        <text x="492" y="32" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="600">4. DL</text>
      </g>
      
      <g transform="translate(20, 120)">
        <circle cx="10" cy="10" r="4" fill="#3fb950"/>
        <text x="22" y="14" fill="#8b949e" font-family="system-ui, sans-serif" font-size="11">Professional Excel report with formatting</text>
        
        <circle cx="10" cy="35" r="4" fill="#3fb950"/>
        <text x="22" y="39" fill="#8b949e" font-family="system-ui, sans-serif" font-size="11">Dashboards and comprehensive analysis</text>
        
        <circle cx="10" cy="60" r="4" fill="#3fb950"/>
        <text x="22" y="64" fill="#8b949e" font-family="system-ui, sans-serif" font-size="11">Export in multiple formats</text>
      </g>
      
      <!-- Workflow 2 -->
      <rect x="560" y="0" width="540" height="200" rx="10" fill="#21262d" stroke="#58a6ff" stroke-width="1"/>
      <text x="830" y="30" text-anchor="middle" fill="#58a6ff" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Workflow 2: Upload and Analyze</text>
      
      <g transform="translate(580, 50)">
        <rect x="0" y="0" width="115" height="55" rx="6" fill="#30363d"/>
        <text x="57" y="20" text-anchor="middle" fill="#79c0ff" font-family="system-ui, sans-serif" font-size="11" font-weight="600">1. Upload</text>
        <text x="57" y="38" text-anchor="middle" fill="#8b949e" font-family="system-ui, sans-serif" font-size="9">Excel Analysis</text>
        
        <path d="M125 27 L140 27" stroke="#58a6ff" stroke-width="2"/>
        <polygon points="140,22 150,27 140,32" fill="#58a6ff"/>
        
        <rect x="155" y="0" width="115" height="55" rx="6" fill="#30363d"/>
        <text x="212" y="20" text-anchor="middle" fill="#79c0ff" font-family="system-ui, sans-serif" font-size="11" font-weight="600">2. Explore</text>
        <text x="212" y="38" text-anchor="middle" fill="#8b949e" font-family="system-ui, sans-serif" font-size="9">Data</text>
        
        <path d="M280 27 L295 27" stroke="#58a6ff" stroke-width="2"/>
        <polygon points="295,22 305,27 295,32" fill="#58a6ff"/>
        
        <rect x="310" y="0" width="115" height="55" rx="6" fill="#30363d"/>
        <text x="367" y="20" text-anchor="middle" fill="#79c0ff" font-family="system-ui, sans-serif" font-size="11" font-weight="600">3. Insights</text>
        <text x="367" y="38" text-anchor="middle" fill="#8b949e" font-family="system-ui, sans-serif" font-size="9">Generate</text>
        
        <path d="M435 27 L450 27" stroke="#58a6ff" stroke-width="2"/>
        <polygon points="450,22 460,27 450,32" fill="#58a6ff"/>
        
        <rect x="465" y="0" width="55" height="55" rx="6" fill="#1f6feb"/>
        <text x="492" y="32" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="600">4. EXP</text>
      </g>
      
      <g transform="translate(580, 120)">
        <circle cx="10" cy="10" r="4" fill="#58a6ff"/>
        <text x="22" y="14" fill="#8b949e" font-family="system-ui, sans-serif" font-size="11">Interactive data exploration</text>
        
        <circle cx="10" cy="35" r="4" fill="#58a6ff"/>
        <text x="22" y="39" fill="#8b949e" font-family="system-ui, sans-serif" font-size="11">Real-time analytics and visualizations</text>
        
        <circle cx="10" cy="60" r="4" fill="#58a6ff"/>
        <text x="22" y="64" fill="#8b949e" font-family="system-ui, sans-serif" font-size="11">Custom filtering and search</text>
      </g>
    </g>
  </g>
</svg>
