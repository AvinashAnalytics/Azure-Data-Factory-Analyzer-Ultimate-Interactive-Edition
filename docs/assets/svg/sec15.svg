<!-- SECTION 15: STAR CALL TO ACTION -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 180" width="100%">
  <defs>
    <linearGradient id="starBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0883e"/>
      <stop offset="100%" style="stop-color:#ffd700"/>
    </linearGradient>
  </defs>
  
  <rect width="1200" height="180" fill="url(#starBg)"/>
  
  <!-- Border accent -->
  <rect x="50" y="20" width="1100" height="140" rx="12" fill="#21262d" stroke="#30363d" stroke-width="1"/>
  
  <!-- Star Icon -->
  <g transform="translate(200, 90)">
    <polygon points="0,-25 7,-8 25,-8 11,4 17,22 0,12 -17,22 -11,4 -25,-8 -7,-8" fill="url(#starGrad)"/>
  </g>
  
  <!-- Text Content -->
  <g transform="translate(260, 75)">
    <text x="0" y="0" fill="#c9d1d9" font-family="system-ui, sans-serif" font-size="24" font-weight="700">
      Star this repository if you find it helpful!
    </text>
    <text x="0" y="35" fill="#8b949e" font-family="system-ui, sans-serif" font-size="14">
      Your support helps improve this project and reach more developers
    </text>
  </g>
  
  <!-- GitHub Button -->
  <g transform="translate(900, 65)">
    <rect x="0" y="0" width="180" height="50" rx="8" fill="#238636"/>
    <text x="90" y="32" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="600">
      Star on GitHub
    </text>
  </g>
</svg>
