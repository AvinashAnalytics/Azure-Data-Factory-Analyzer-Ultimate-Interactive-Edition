<!-- SECTION 14: DEPENDENCY GRAPH VISUALIZATION -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="100%">
  <defs>
    <linearGradient id="graphBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#58a6ff" opacity="0.6"/>
    </marker>
  </defs>
  
  <rect width="1200" height="500" fill="url(#graphBg)"/>
  
  <!-- Section Header -->
  <g transform="translate(600, 45)">
    <text x="0" y="0" text-anchor="middle" fill="#79c0ff" font-family="system-ui, sans-serif" font-size="28" font-weight="700">
      Resource Dependency Network
    </text>
    <rect x="-120" y="12" width="240" height="3" rx="1.5" fill="#79c0ff" opacity="0.6"/>
  </g>
  
  <!-- Dependency Graph -->
  <g transform="translate(100, 100)">
    <!-- Triggers Layer -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="150" height="80" rx="8" fill="#21262d" stroke="#f0883e" stroke-width="2" opacity="0.9"/>
      <text x="75" y="25" text-anchor="middle" fill="#f0883e" font-family="system-ui, sans-serif" font-size="12" font-weight="600">TRIGGERS</text>
      <circle cx="50" cy="55" r="15" fill="#f0883e" opacity="0.3"/>
      <text x="50" y="60" text-anchor="middle" fill="#f0883e" font-family="system-ui, sans-serif" font-size="11">T1</text>
      <circle cx="100" cy="55" r="15" fill="#f0883e" opacity="0.3"/>
      <text x="100" y="60" text-anchor="middle" fill="#f0883e" font-family="system-ui, sans-serif" font-size="11">T2</text>
    </g>
    
    <!-- Pipelines Layer -->
    <g transform="translate(200, 0)">
      <rect x="0" y="0" width="200" height="80" rx="8" fill="#21262d" stroke="#f85149" stroke-width="2" opacity="0.9"/>
      <text x="100" y="25" text-anchor="middle" fill="#f85149" font-family="system-ui, sans-serif" font-size="12" font-weight="600">PIPELINES</text>
      <circle cx="40" cy="55" r="15" fill="#f85149" opacity="0.3"/>
      <text x="40" y="60" text-anchor="middle" fill="#f85149" font-family="system-ui, sans-serif" font-size="11">P1</text>
      <circle cx="100" cy="55" r="15" fill="#f85149" opacity="0.3"/>
      <text x="100" y="60" text-anchor="middle" fill="#f85149" font-family="system-ui, sans-serif" font-size="11">P2</text>
      <circle cx="160" cy="55" r="15" fill="#f85149" opacity="0.3"/>
      <text x="160" y="60" text-anchor="middle" fill="#f85149" font-family="system-ui, sans-serif" font-size="11">P3</text>
    </g>
    
    <!-- Activities Layer -->
    <g transform="translate(450, 0)">
      <rect x="0" y="0" width="250" height="80" rx="8" fill="#21262d" stroke="#58a6ff" stroke-width="2" opacity="0.9"/>
      <text x="125" y="25" text-anchor="middle" fill="#58a6ff" font-family="system-ui, sans-serif" font-size="12" font-weight="600">ACTIVITIES</text>
      <circle cx="35" cy="55" r="15" fill="#58a6ff" opacity="0.3"/>
      <text x="35" y="60" text-anchor="middle" fill="#58a6ff" font-family="system-ui, sans-serif" font-size="11">A1</text>
      <circle cx="90" cy="55" r="15" fill="#58a6ff" opacity="0.3"/>
      <text x="90" y="60" text-anchor="middle" fill="#58a6ff" font-family="system-ui, sans-serif" font-size="11">A2</text>
      <circle cx="145" cy="55" r="15" fill="#58a6ff" opacity="0.3"/>
      <text x="145" y="60" text-anchor="middle" fill="#58a6ff" font-family="system-ui, sans-serif" font-size="11">A3</text>
      <circle cx="200" cy="55" r="15" fill="#58a6ff" opacity="0.3"/>
      <text x="200" y="60" text-anchor="middle" fill="#58a6ff" font-family="system-ui, sans-serif" font-size="11">A4</text>
    </g>
    
    <!-- DataFlows Layer -->
    <g transform="translate(750, 0)">
      <rect x="0" y="0" width="150" height="80" rx="8" fill="#21262d" stroke="#3fb950" stroke-width="2" opacity="0.9"/>
      <text x="75" y="25" text-anchor="middle" fill="#3fb950" font-family="system-ui, sans-serif" font-size="12" font-weight="600">DATAFLOWS</text>
      <circle cx="50" cy="55" r="15" fill="#3fb950" opacity="0.3"/>
      <text x="50" y="60" text-anchor="middle" fill="#3fb950" font-family="system-ui, sans-serif" font-size="11">DF1</text>
      <circle cx="100" cy="55" r="15" fill="#3fb950" opacity="0.3"/>
      <text x="100" y="60" text-anchor="middle" fill="#3fb950" font-family="system-ui, sans-serif" font-size="11">DF2</text>
    </g>
    
    <!-- Second Row -->
    <!-- Datasets Layer -->
    <g transform="translate(200, 130)">
      <rect x="0" y="0" width="250" height="80" rx="8" fill="#21262d" stroke="#a371f7" stroke-width="2" opacity="0.9"/>
      <text x="125" y="25" text-anchor="middle" fill="#a371f7" font-family="system-ui, sans-serif" font-size="12" font-weight="600">DATASETS</text>
      <circle cx="45" cy="55" r="15" fill="#a371f7" opacity="0.3"/>
      <text x="45" y="60" text-anchor="middle" fill="#a371f7" font-family="system-ui, sans-serif" font-size="11">DS1</text>
      <circle cx="125" cy="55" r="15" fill="#a371f7" opacity="0.3"/>
      <text x="125" y="60" text-anchor="middle" fill="#a371f7" font-family="system-ui, sans-serif" font-size="11">DS2</text>
      <circle cx="205" cy="55" r="15" fill="#a371f7" opacity="0.3"/>
      <text x="205" y="60" text-anchor="middle" fill="#a371f7" font-family="system-ui, sans-serif" font-size="11">DS3</text>
    </g>
    
    <!-- Linked Services Layer -->
    <g transform="translate(500, 130)">
      <rect x="0" y="0" width="180" height="80" rx="8" fill="#21262d" stroke="#79c0ff" stroke-width="2" opacity="0.9"/>
      <text x="90" y="25" text-anchor="middle" fill="#79c0ff" font-family="system-ui, sans-serif" font-size="12" font-weight="600">LINKED SERVICES</text>
      <circle cx="55" cy="55" r="15" fill="#79c0ff" opacity="0.3"/>
      <text x="55" y="60" text-anchor="middle" fill="#79c0ff" font-family="system-ui, sans-serif" font-size="11">LS1</text>
      <circle cx="125" cy="55" r="15" fill="#79c0ff" opacity="0.3"/>
      <text x="125" y="60" text-anchor="middle" fill="#79c0ff" font-family="system-ui, sans-serif" font-size="11">LS2</text>
    </g>
    
    <!-- Integration Runtimes Layer -->
    <g transform="translate(730, 130)">
      <rect x="0" y="0" width="180" height="80" rx="8" fill="#21262d" stroke="#8b949e" stroke-width="2" opacity="0.9"/>
      <text x="90" y="25" text-anchor="middle" fill="#8b949e" font-family="system-ui, sans-serif" font-size="12" font-weight="600">INT. RUNTIMES</text>
      <circle cx="55" cy="55" r="15" fill="#8b949e" opacity="0.3"/>
      <text x="55" y="60" text-anchor="middle" fill="#8b949e" font-family="system-ui, sans-serif" font-size="11">IR1</text>
      <circle cx="125" cy="55" r="15" fill="#8b949e" opacity="0.3"/>
      <text x="125" y="60" text-anchor="middle" fill="#8b949e" font-family="system-ui, sans-serif" font-size="11">IR2</text>
    </g>
    
    <!-- Connection Lines -->
    <g stroke="#58a6ff" stroke-width="1.5" fill="none" opacity="0.5">
      <!-- Trigger to Pipeline -->
      <path d="M125 55 Q175 55 225 55" marker-end="url(#arrow)"/>
      
      <!-- Pipeline to Activities -->
      <path d="M375 55 Q425 55 475 55" marker-end="url(#arrow)"/>
      
      <!-- Activities to DataFlows -->
      <path d="M675 55 Q725 55 775 55" marker-end="url(#arrow)"/>
      
      <!-- DataFlows to Datasets -->
      <path d="M825 80 Q825 105 450 170" marker-end="url(#arrow)"/>
      
      <!-- Datasets to Linked Services -->
      <path d="M450 170 Q475 170 555 170" marker-end="url(#arrow)"/>
      
      <!-- Linked Services to Runtimes -->
      <path d="M680 170 Q705 170 785 170" marker-end="url(#arrow)"/>
    </g>
  </g>
  
  <!-- Dependency Types Legend -->
  <g transform="translate(100, 360)">
    <text x="0" y="0" fill="#58a6ff" font-family="system-ui, sans-serif" font-size="16" font-weight="600">10 Dependency Types Tracked</text>
    
    <g transform="translate(0, 25)">
      <rect x="0" y="0" width="180" height="28" rx="4" fill="#21262d"/>
      <text x="15" y="19" fill="#8b949e" font-family="system-ui, sans-serif" font-size="11">activity -> activity</text>
      
      <rect x="195" y="0" width="180" height="28" rx="4" fill="#21262d"/>
      <text x="210" y="19" fill="#8b949e" font-family="system-ui, sans-serif" font-size="11">activity -> dataset</text>
      
      <rect x="390" y="0" width="180" height="28" rx="4" fill="#21262d"/>
      <text x="405" y="19" fill="#8b949e" font-family="system-ui, sans-serif" font-size="11">pipeline -> pipeline</text>
      
      <rect x="585" y="0" width="180" height="28" rx="4" fill="#21262d"/>
      <text x="600" y="19" fill="#8b949e" font-family="system-ui, sans-serif" font-size="11">pipeline -> dataflow</text>
      
      <rect x="780" y="0" width="180" height="28" rx="4" fill="#21262d"/>
      <text x="795" y="19" fill="#8b949e" font-family="system-ui, sans-serif" font-size="11">trigger -> pipeline</text>
    </g>
    
    <g transform="translate(0, 60)">
      <rect x="0" y="0" width="180" height="28" rx="4" fill="#21262d"/>
      <text x="15" y="19" fill="#8b949e" font-family="system-ui, sans-serif" font-size="11">dataflow -> dataset</text>
      
      <rect x="195" y="0" width="180" height="28" rx="4" fill="#21262d"/>
      <text x="210" y="19" fill="#8b949e" font-family="system-ui, sans-serif" font-size="11">dataflow -> linkedsvc</text>
      
      <rect x="390" y="0" width="180" height="28" rx="4" fill="#21262d"/>
      <text x="405" y="19" fill="#8b949e" font-family="system-ui, sans-serif" font-size="11">dataset -> linkedsvc</text>
      
      <rect x="585" y="0" width="180" height="28" rx="4" fill="#21262d"/>
      <text x="600" y="19" fill="#8b949e" font-family="system-ui, sans-serif" font-size="11">linkedsvc -> runtime</text>
      
      <rect x="780" y="0" width="180" height="28" rx="4" fill="#21262d"/>
      <text x="795" y="19" fill="#8b949e" font-family="system-ui, sans-serif" font-size="11">arm_depends_on</text>
    </g>
  </g>
</svg>
